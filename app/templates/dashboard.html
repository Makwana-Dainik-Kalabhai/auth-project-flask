{% extends "base.html" %}

{% block content %}
<div class="dashboard-card">
    <div class="text-center">
        <div class="user-avatar">
            {{ user.username[0].upper() }}
        </div>
        <h3 class="fw-bold">Welcome, {{ user.username }}!</h3>
        <p class="text-muted">You are logged in to your dashboard</p>
    </div>
    
    <hr>
    
    <div class="row mt-4">
        <div class="col-12">
            <div class="d-flex flex-column gap-3">
                <div class="d-flex justify-content-between align-items-center p-3 bg-light rounded">
                    <span><i class="fas fa-user me-2 text-primary"></i>Username</span>
                    <span class="fw-bold">{{ user.username }}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center p-3 bg-light rounded">
                    <span><i class="fas fa-envelope me-2 text-primary"></i>Email</span>
                    <span class="fw-bold">{{ user.email }}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center p-3 bg-light rounded">
                    <span><i class="fas fa-calendar me-2 text-primary"></i>Joined</span>
                    <span class="fw-bold">{{ user.created_at.strftime('%B %d, %Y') }}</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="d-flex gap-2 mt-4">
        <a href="{{ url_for('routes.logout') }}" class="btn btn-danger w-100">
            <i class="fas fa-sign-out-alt me-2"></i>Logout
        </a>
    </div>
</div>
{% endblock %}
